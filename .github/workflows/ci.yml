name: ESN CAM CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source syntax
        run: |
          node --version
          node --check src/index.js
          node --check src/config.js
          node --check src/minecraft.js
          node --check src/scenes.js
          node --check src/recorder.js
          node --check src/discord.js
          node --check src/diagnostics.js
          node --check src/growth.js
          node --check src/finance.js
          node --check src/video.js
          node --check src/java.js
          node --check src/java-render.js
          node --check src/research.js
          python -m py_compile cinematic-worker/server.py
